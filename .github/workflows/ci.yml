name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Verify production build shape
        run: |
          test -f dist/src/server.js
          test -f dist/src/admin.js
          test -f dist/src/doctor.js
          test ! -d dist/tests
      - name: Smoke-test compiled production server
        run: |
          export NODE_ENV=production
          export CONNECTOR_AUTH_TOKEN=1234567890abcdef1234567890abcdef
          export CONNECTOR_BIND_HOST=127.0.0.1
          export CONNECTOR_ALLOWED_HOSTS=127.0.0.1
          export MAIL_USERNAME=smoke@example.com
          export MAIL_APP_PASSWORD=smoke-password
          export MAIL_FROM_NAME=Smoke
          export MAIL_ADMIN_PASSWORD=admin-password-1234
          export MAIL_ACCOUNT_STORE_KEY=0123456789abcdef0123456789abcdef
          export MAIL_ACCOUNT_STORE_PATH="${RUNNER_TEMP}/mail-accounts.json"
          export PORT=3100
          node dist/src/server.js >"${RUNNER_TEMP}/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "${SERVER_PID}" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3100/health >/dev/null; then break; fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:3100/health | grep '"ok":true'
          curl --fail --silent http://127.0.0.1:3100/ready | grep '"ok":true'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3100/favicon.ico)" = "204"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3100/admin)" = "401"
          curl --fail --silent --user admin:admin-password-1234 http://127.0.0.1:3100/admin | grep 'id="addMailbox"'
          curl --fail --silent --user admin:admin-password-1234 http://127.0.0.1:3100/admin | grep '<script src="/admin/app.js" defer></script>'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3100/admin/app.js)" = "401"
          curl --fail --silent --user admin:admin-password-1234 http://127.0.0.1:3100/admin/app.js | grep 'cards.replaceChildren'
          DEPLOY_BASE_URL=http://127.0.0.1:3100 npm run probe
          kill "${SERVER_PID}"
          wait "${SERVER_PID}" || true
          trap - EXIT
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit all dependencies
        run: npm audit --audit-level=moderate
      - name: Build production container
        run: docker build -t creator-outreach-engine:ci .
